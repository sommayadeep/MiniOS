name: Render Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Render backend health
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_SERVICE_URL:-}" ]; then
            echo "RENDER_SERVICE_URL secret is not configured."
            exit 1
          fi

          health_url="${RENDER_SERVICE_URL%/}/health"
          echo "Checking ${health_url}"

          if response=$(curl --silent --show-error --fail \
            --max-time 15 \
            --write-out '\nHTTP_STATUS:%{http_code}' \
            "$health_url"); then
            http_status="${response##*HTTP_STATUS:}"
            response_body="${response%$'\n'HTTP_STATUS:*}"
            if [ "$http_status" = "200" ]; then
              echo "Health check succeeded (HTTP ${http_status}): ${response_body}"
            else
              echo "Health check returned HTTP ${http_status}: ${response_body}"
              exit 1
            fi
          else
            result=$?
            echo "Health check failed (curl exit ${result})."
            exit "$result"
          fi
